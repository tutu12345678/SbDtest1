name: Secure by Design Assessment Automation

# Runs hourly by default. Change the cron expression to "0 6 * * *" for a
# once-daily run at 06:00 UTC instead, if hourly is more than you need.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, no tickets created)"
        required: true
        type: boolean
        default: true

# Least-privilege token permissions for this workflow.
permissions:
  contents: read

jobs:
  create-assessment-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests

      - name: Run Secure by Design ticket automation
        env:
          ADO_ORG_URL: ${{ secrets.ADO_ORG_URL }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          # Scoped to one POD for the dry run. Remove this line later if/when
          # you want the automation to cover the whole project.
          ADO_AREA_PATH: ${{ secrets.ADO_AREA_PATH }}
          # Required. This is what defines "this month" for the script now —
          # update the secret value each month, e.g. to
          # ADI\CDQ-iPAL_PowerApps\2026\Y26-Nov once November starts.
          ADO_ITERATION_PATH: ${{ secrets.ADO_ITERATION_PATH }}
          # Manual runs (Actions tab -> Run workflow) use the checkbox above,
          # defaulting to true. Scheduled hourly runs always use the "true"
          # fallback here too, so the schedule stays a no-op dry run until
          # you deliberately flip this line to "false".
          DRY_RUN: ${{ inputs.dry_run != false }}
        run: python create_assessment_tickets.py
